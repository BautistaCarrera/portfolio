# QA automático en cada Pull Request, con el agente https://github.com/BautistaCarrera/qa-agent
# El perfil que define qué comandos se ejecutan vive en .qa-agent/profile.yaml
name: QA
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    # Versión fijada: el workflow (@v0.1.0) y el código del agente (qa-agent-ref) deben coincidir.
    uses: BautistaCarrera/qa-agent/.github/workflows/qa.yml@v0.1.0
    with:
      qa-agent-ref: v0.1.0
      fail-on: block      # block | inconclusive | never
      analyst: false      # true agrega el análisis con IA (requiere el secreto ANTHROPIC_API_KEY)
    # secrets:
    #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
